name: admin-visual-capture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "pages/admin-*/**"
      - "services/admin-preview-fixtures.js"
      - "scripts/admin-v2-visual-*.js"
      - "scripts/admin-v2-preview-entry*.js"
      - "scripts/admin-v2-visual-runner*"
      - "scripts/admin-v2-devtools-cli-capture*"
      - "scripts/ensure-devtools-9437*"
      - "scripts/admin-v2-state-matrix*.js"
      - "scripts/admin-v2-device-matrix*.js"
      - "visual-evidence/**"

permissions:
  contents: read

jobs:
  capture:
    # 专用微信开发者工具 runner 配好后才执行真实截图；没有 runner 时
    # 让检查明确跳过，不能把整个发布队列永久卡在 pending。
    if: ${{ vars.WECHAT_DEVTOOLS_CLI != '' && vars.MINIPROGRAM_AUTOMATOR_PATH != '' }}
    runs-on: [self-hosted, Windows, admin-visual]
    timeout-minutes: 20
    env:
      WECHAT_DEVTOOLS_CLI: ${{ vars.WECHAT_DEVTOOLS_CLI }}
      MINIPROGRAM_AUTOMATOR_PATH: ${{ vars.MINIPROGRAM_AUTOMATOR_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify runner tools
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WECHAT_DEVTOOLS_CLI) -or -not (Test-Path -LiteralPath $env:WECHAT_DEVTOOLS_CLI -PathType Leaf)) {
            throw "WECHAT_DEVTOOLS_CLI 未配置或文件不存在"
          }
          if ([string]::IsNullOrWhiteSpace($env:MINIPROGRAM_AUTOMATOR_PATH) -or -not (Test-Path -LiteralPath $env:MINIPROGRAM_AUTOMATOR_PATH)) {
            throw "MINIPROGRAM_AUTOMATOR_PATH 未配置或目录不存在"
          }
      - name: Verify unified runner
        shell: pwsh
        run: ./scripts/admin-v2-visual-runner.ps1 -ProjectPath "$env:GITHUB_WORKSPACE" -CliPath "$env:WECHAT_DEVTOOLS_CLI" -AutomatorPath "$env:MINIPROGRAM_AUTOMATOR_PATH" -CheckOnly
      - name: Verify DevTools skill CLI capture contract
        shell: pwsh
        run: node scripts/admin-v2-devtools-cli-capture-smoke.js
      - name: Verify 9437 launcher contract
        shell: pwsh
        run: node scripts/ensure-devtools-9437-smoke.js
      - name: Capture real simulator states
        shell: pwsh
        run: ./scripts/admin-v2-visual-runner.ps1 -ProjectPath "$env:GITHUB_WORKSPACE" -CliPath "$env:WECHAT_DEVTOOLS_CLI" -AutomatorPath "$env:MINIPROGRAM_AUTOMATOR_PATH" -OutputPath "visual-evidence/ci-capture" -AllStates
      - name: Upload immutable visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-${{ github.sha }}
          path: visual-evidence/ci-capture
          if-no-files-found: error
          retention-days: 14
