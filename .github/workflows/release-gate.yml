name: release-gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch:

# Serialize checks for the same repository/base branch.  GitHub may collapse
# multiple pending UI runs, but it never cancels the active run; the durable
# release queue is the source of truth for strict FIFO and recovery.
concurrency:
  group: release-gate-${{ github.repository }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: windows-latest
    # The local publisher may wait up to 30 minutes for a required check.
    # Leave room for the same smoke suite on a busy hosted runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: tools/user-center-preview/package-lock.json
      - name: Release workflow concurrency and protection preflight
        shell: pwsh
        env:
          RELEASE_WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_WORKFLOW_REF_NAME: ${{ github.ref_name }}
          RELEASE_WORKFLOW_BASE_REF: ${{ github.base_ref }}
          RELEASE_WORKFLOW_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/release-workflow-smoke.js --runtime
      - name: Public repository compatibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "User-Agent" = "wechat-miniapp-release-gate"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            $headers["Authorization"] = "Bearer $env:GH_TOKEN"
          }
          $repo = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY" `
            -Headers $headers `
            -TimeoutSec 20
          if ($repo.visibility -notin @("public", "private", "internal")) {
            throw "GitHub 返回了未知仓库可见性：$($repo.visibility)"
          }
          if ($repo.visibility -eq "public") {
            Write-Host "公开仓库模式：不依赖 GitHub Pro/Team，继续使用 PR-only 和 release-gate 必需检查。"
          }
          else {
            Write-Host "仓库可见性=$($repo.visibility)：发布闸门保持同一套保护契约。"
          }
      - name: Release hooks smoke
        shell: pwsh
        run: node scripts/release-hooks-smoke.js
      - name: Cache cloud-function npm download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wechat-miniapp-npm-cache
          key: npm-cloudfunctions-${{ hashFiles('cloudfunctions/api/package-lock.json', 'cloudfunctions/payment-api/package-lock.json', 'cloudfunctions/payment-notify/package-lock.json', 'cloudfunctions/payment-reconcile/package-lock.json') }}
          restore-keys: |
            npm-cloudfunctions-
      - name: Prepare API dependency cache
        shell: pwsh
        env:
          WECHAT_MINIPROGRAM_NPM_CACHE_PATH: ${{ runner.temp }}/wechat-miniapp-npm-cache
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\npm-dependency-cache.ps1"
          $info = Ensure-LocalCloudFunctionDependencies `
            -ApiPath "$env:GITHUB_WORKSPACE\cloudfunctions\api" `
            -DependencyCheckScript "$env:GITHUB_WORKSPACE\scripts\check-cloudfunction-dependencies.js"
          Write-Host "API npm cache key: $($info.Key)"
      - name: Prepare fail-closed payment function dependencies
        shell: pwsh
        env:
          WECHAT_MINIPROGRAM_NPM_CACHE_PATH: ${{ runner.temp }}/wechat-miniapp-npm-cache
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\npm-dependency-cache.ps1"
          $results = Ensure-ManifestCloudFunctionDependencies `
            -ProjectRoot $env:GITHUB_WORKSPACE `
            -ManifestPath "$env:GITHUB_WORKSPACE\scripts\payment-cloudfunctions.json" `
            -DependencyCheckScript "$env:GITHUB_WORKSPACE\scripts\check-cloudfunction-dependencies.js"
          foreach ($item in $results) {
            Write-Host "$($item.FunctionName) npm cache key: $($item.Key)"
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare external release policy
        shell: pwsh
        run: |
          $repo = (Resolve-Path $env:GITHUB_WORKSPACE).Path
          $parent = Split-Path $repo -Parent
          $policy = [ordered]@{
            schemaVersion = 1
            canonicalRepo = $repo
            remote = "https://github.com/ssqaq/quxiang-chuangzuo-miniprogram.git"
            branch = "main"
            lockPath = Join-Path $parent "wechat-miniapp-release.lock"
            queueRoot = Join-Path $parent "wechat-miniapp-release-queue"
            artifactRoot = $parent
            reservationRoot = Join-Path $parent "wechat-miniapp-release-reservations"
            worktreeRoot = Join-Path $parent "wechat-miniapp-release-worktrees"
            recordRoot = Join-Path $parent "wechat-miniapp-release-records"
            contextRoot = Join-Path $parent "wechat-miniapp-release-contexts"
            logRoot = Join-Path $parent "wechat-miniapp-release-logs"
            reportRoot = Join-Path $parent "wechat-miniapp-release-reports"
            backupRoot = Join-Path $parent "wechat-miniapp-release-backups"
            alertRoot = Join-Path (Join-Path $parent "wechat-miniapp-release-logs") "alerts"
            latestReleasePath = Join-Path $parent "wechat-miniapp-latest-release.json"
            archiveManifestPath = Join-Path $parent "wechat-miniapp-release-archive.json"
            mainProtection = [ordered]@{ mode = "pr-only"; requiredWorkflow = "release-gate.yml"; applyToAdmins = $true; enforceOnPublish = $true }
            queue = [ordered]@{ waitSeconds = 1800; pollMilliseconds = 500; leaseSeconds = 180; staleAfterSeconds = 600; maxAttempts = 3 }
            immutableArtifacts = $true
            allowSourceWorktrees = $true
          }
          $policyPath = Join-Path $parent "wechat-miniapp-release-policy.json"
          $policy | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $policyPath -Encoding utf8
      - name: Core release smoke entrypoint preflight
        shell: pwsh
        run: |
          $required = @(
            "scripts/account-points-format-smoke.js",
            "scripts/points-checkin-smoke.js",
            "scripts/account-points-fallback-smoke.js",
            "scripts/workbench-interaction-smoke.js"
          )
          $missing = @(
            $required | Where-Object {
              -not (Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $_) -PathType Leaf)
            }
          )
          if ($missing.Count -gt 0) {
            throw "核心 release smoke 入口缺失：$($missing -join ', ')"
          }
          Write-Host "核心 release smoke 入口已确认：$($required -join ', ')"
      - name: Install versioned preview dependencies
        shell: pwsh
        run: npm ci --prefix "$env:GITHUB_WORKSPACE\tools\user-center-preview"
      - name: Validate source
        shell: pwsh
        env:
          SHARP_MODULE: ${{ github.workspace }}\tools\user-center-preview\node_modules\sharp
        run: node scripts/validate.js
      - name: User center version smoke
        shell: pwsh
        run: node scripts/user-center-version-smoke.js
      - name: Core account points and workbench smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokes = @(
            "scripts/account-points-format-smoke.js",
            "scripts/points-checkin-smoke.js",
            "scripts/account-points-fallback-smoke.js",
            "scripts/workbench-interaction-smoke.js"
          )
          foreach ($relative in $smokes) {
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE $relative
            Write-Host "::group::$relative"
            $exitCode = 0
            try {
              & node $scriptPath
              $exitCode = $LASTEXITCODE
            }
            finally {
              Write-Host "::endgroup::"
            }
            if ($exitCode -ne 0) {
              throw "核心 release smoke 失败：$relative（退出码 $exitCode）"
            }
          }
      - name: Preview source budget
        shell: pwsh
        run: node scripts/preview-source-budget.js --metric raw --max-bytes 2097152 --warn-bytes 1887436
      - name: Same-device visual baseline
        shell: pwsh
        run: node scripts/admin-v2-same-device-baseline.js
      - name: Layout contract
        shell: pwsh
        run: node scripts/admin-v2-layout-contract.js
      - name: Font contract
        shell: pwsh
        run: node scripts/admin-v2-font-contract.js
      - name: Runtime geometry probe smoke
        shell: pwsh
        run: node scripts/admin-v2-runtime-geometry-probe-smoke.js
      - name: Runtime geometry contract
        shell: pwsh
        run: node scripts/admin-v2-runtime-geometry-probe.js --input visual-evidence/runtime-geometry/browser-probe.json --output visual-evidence/runtime-geometry/geometry-contract.json
      - name: Runtime font probe smoke
        shell: pwsh
        run: node scripts/admin-v2-runtime-font-probe-smoke.js
      - name: Visual archive retention smoke
        shell: pwsh
        run: node scripts/admin-v2-visual-archive-smoke.js
      - name: Release visual evidence manifest
        shell: pwsh
        run: node scripts/admin-v2-release-evidence-check.js --check-only
      - name: Provider refresh and swipe contract
        shell: pwsh
        run: node scripts/admin-provider-interaction-regression.js --check-only
      - name: Post-release visual check smoke
        shell: pwsh
        run: node scripts/admin-v2-post-release-visual-check-smoke.js
      - name: Visual state matrix smoke
        shell: pwsh
        run: node scripts/admin-v2-state-matrix-smoke.js
      - name: Visual device matrix smoke
        shell: pwsh
        run: node scripts/admin-v2-device-matrix-smoke.js
      - name: Strict visual capture gate smoke
        shell: pwsh
        run: node scripts/admin-v2-visual-capture-gate-smoke.js
      - name: Unified visual runner smoke
        shell: pwsh
        run: node scripts/admin-v2-visual-runner-smoke.js
      - name: Preview entry smoke
        shell: pwsh
        run: node scripts/admin-v2-preview-entry-smoke.js
      - name: Visual archive index smoke
        shell: pwsh
        run: node scripts/admin-v2-visual-index-smoke.js
      - name: Visual state matrix contract
        shell: pwsh
        run: node scripts/admin-v2-state-matrix.js
      - name: Visual device matrix contract
        shell: pwsh
        run: node scripts/admin-v2-device-matrix.js
      - name: Four-page pixel regression
        shell: pwsh
        run: node scripts/admin-v2-pixel-baseline.js --manifest visual-evidence/admin-v2-pixel-manifest-current.json --threshold 32 --max-diff-ratio 0.5
      - name: Four-page pixel diff report
        shell: pwsh
        run: node scripts/admin-v2-pixel-diff-report.js --json visual-evidence/pixel-diffs/admin-v2-pixel-diff-report.json --markdown visual-evidence/pixel-diffs/admin-v2-pixel-diff-report.md
      - name: Preview QR decode
        shell: pwsh
        run: node scripts/qr-decode-smoke.js
      - name: Payment UI smoke
        shell: pwsh
        run: node scripts/payment-ui-smoke.js
      - name: Payment package and deployment safety smoke
        shell: pwsh
        run: node scripts/payment-deployment-smoke.js
      - name: Payment production deployment smoke
        shell: pwsh
        run: node scripts/payment-production-deploy-smoke.js
      - name: Payment records cursor smoke
        shell: pwsh
        run: node scripts/payment-records-cursor-smoke.js
      - name: Payment monitor smoke
        shell: pwsh
        run: node scripts/payment-monitor-smoke.js
      - name: Database index contract smoke
        shell: pwsh
        run: node scripts/database-index-smoke.js
      - name: Payment dependency manifest check
        shell: pwsh
        run: node scripts/check-cloudfunction-dependencies.js --manifest scripts/payment-cloudfunctions.json
      - name: Payment core tests
        shell: pwsh
        run: npm test --prefix cloudfunctions/payment-core
      - name: Release safety smoke
        shell: pwsh
        run: node scripts/release-safety-smoke.js
      - name: Release lock smoke
        shell: pwsh
        run: node scripts/release-lock-smoke.js
      - name: Release lock health smoke
        shell: pwsh
        run: node scripts/release-lock-health-smoke.js
      - name: Release queue smoke
        shell: pwsh
        run: node scripts/release-queue-smoke.js
      - name: Version concurrency smoke
        shell: pwsh
        run: node scripts/version-concurrency-smoke.js
      - name: Release gate smoke
        shell: pwsh
        run: node scripts/release-gate-smoke.js
      - name: Release failure-stage contract smoke
        shell: pwsh
        run: node scripts/release-workflow-smoke.js
      - name: Resume release recovery smoke
        shell: pwsh
        run: node scripts/resume-release-smoke.js
      - name: Cloud deploy safety smoke
        shell: pwsh
        run: node scripts/cloud-deploy-safety-smoke.js
      - name: Cloud deploy entry smoke
        shell: pwsh
        run: node scripts/deployment-script-smoke.js
      - name: Package smoke
        shell: pwsh
        run: python scripts/package-release-smoke.py
      - name: Package read-only check
        shell: pwsh
        run: python scripts/package-release.py --check-only --source-tree HEAD
