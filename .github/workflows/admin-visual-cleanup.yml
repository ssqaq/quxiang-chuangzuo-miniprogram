name: admin-visual-cleanup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: cleanup-expired-admin-visual-evidence
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Remove visual evidence older than three days
        shell: pwsh
        run: >-
          node scripts/admin-v2-visual-archive.js
          --cleanup-only
          --root "$env:GITHUB_WORKSPACE"
          --output-root "visual-evidence/archive"
          --retain-days 3
