<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>微信小程序发布状态</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:#15243b; background:#f3f8fd; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; }
    main { max-width:980px; margin:0 auto; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; }
    h1 { margin:0; font-size:28px; letter-spacing:0; }
    .sub { margin-top:6px; color:#71849c; font-size:14px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
    .file { padding:10px 12px; border:1px solid #c4d9f3; border-radius:9px; color:#2f6fed; background:#fff; }
    .hint { color:#71849c; font-size:13px; }
    .empty { padding:28px; border:1px solid #d8e5f1; border-radius:12px; background:#fff; color:#71849c; text-align:center; }
    .operation { margin-top:14px; padding:18px; border:1px solid #d8e5f1; border-radius:12px; background:#fff; box-shadow:0 8px 24px rgba(53,91,133,.06); }
    .operation-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .version { font-size:20px; font-weight:800; }
    .meta { margin-top:4px; color:#71849c; font-size:13px; overflow-wrap:anywhere; }
    .badge { padding:5px 10px; border-radius:999px; font-size:13px; font-weight:700; white-space:nowrap; }
    .badge.succeeded,.pass { color:#16825d; background:#e3f7ef; }
    .badge.pending { color:#a0641a; background:#fff1db; }
    .badge.failed,.fail { color:#b43b3b; background:#fdeaea; }
    table { width:100%; margin-top:16px; border-collapse:collapse; font-size:13px; }
    th,td { padding:10px 8px; border-top:1px solid #edf2f7; text-align:left; vertical-align:top; }
    th { color:#71849c; font-weight:600; }
    .status { font-weight:700; }
    @media (max-width:640px) { body { padding:14px; } header { display:block; } h1 { font-size:24px; } .operation { padding:14px; overflow:auto; } table { min-width:650px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>微信小程序发布状态</h1><div class="sub">查看版本、ZIP、GitHub、开发者工具编译和 CloudBase 核验结果</div></div>
    </header>
    <div class="toolbar"><input id="file" class="file" type="file" accept=".json,application/json"><span class="hint">选择 release-status.json 或 release-操作ID.json；页面只读，不会改发布状态。</span></div>
    <div id="root" class="empty">正在尝试读取同目录的 release-status.json…</div>
  </main>
  <script>
    const root = document.getElementById("root");
    const labels = { main: "GitHub main", artifact: "ZIP", previewImport: "开发者工具", qr: "二维码", cloudbase: "CloudBase" };
    const icon = value => value === "pass" || value === "succeeded" ? "✅" : value === "fail" || value === "failed" ? "❌" : "⏳";
    const text = value => value == null ? "" : String(value);
    function reportList(payload) {
      if (Array.isArray(payload)) return payload;
      if (payload && Array.isArray(payload.operations)) return payload.operations;
      return payload ? [payload] : [];
    }
    function render(payload) {
      const reports = reportList(payload);
      if (!reports.length) { root.className = "empty"; root.textContent = "没有找到发布记录。"; return; }
      root.className = "";
      root.innerHTML = reports.map(report => {
        const evidence = report.evidence || {};
        const rows = ["main", "artifact", "previewImport", "qr", "cloudbase"].map(key => {
          const item = evidence[key] || {};
          const status = text(item.status || "pending");
          return `<tr><th>${labels[key]}</th><td class="status ${status}">${icon(status)} ${status}</td><td>${text(item.message || "待核对")}</td></tr>`;
        }).join("");
        const status = text(report.status || report.verdict || "pending");
        return `<section class="operation"><div class="operation-head"><div><div class="version">v${text(report.version || "-")}</div><div class="meta">操作 ID：${text(report.operationId || "-")}<br>生成时间：${text(report.generatedAt || "-")}</div></div><span class="badge ${status}">${icon(status)} ${status}</span></div><table><thead><tr><th>检查项</th><th>状态</th><th>说明</th></tr></thead><tbody>${rows}</tbody></table></section>`;
      }).join("");
    }
    document.getElementById("file").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { try { render(JSON.parse(reader.result)); } catch (error) { root.className = "empty"; root.textContent = `JSON 读取失败：${error.message}`; } };
      reader.readAsText(file, "utf-8");
    });
    fetch("release-status.json").then(response => response.ok ? response.json() : Promise.reject(new Error("同目录没有 release-status.json"))).then(render).catch(() => { root.className = "empty"; root.textContent = "请选择发布状态 JSON 文件。"; });
  </script>
</body>
</html>
